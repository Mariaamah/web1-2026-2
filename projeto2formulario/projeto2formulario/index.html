<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulário</h1>
    <form>
        <fieldset>
            <legend>Dados pessoais</legend>
            <br><label for="name">nome:</label><br>
            <input type="text" >
            <br><label for="name">Data de nascimento:</label><br>
            <input type="date" >
            
            <br><label for="Endereço">Endereço:</label><br>
            <input type="text" >
            <br><label for="Bairro">Bairro:</label><br>
            <input type="text" >
            <label for="Cidade">Cidade:</label>
            <input type="text" >
            <br><label for="Cep">CEP:</label><br>
            <input type="number" >
            <label for="Estado">Estado:</label>
            <select>
                <option value="CE">Ceará</option>
            </select>
            <label>Cor favorita</label>
            <input type ="color">
            <br><label>Nível de satisfação</label>
            <span>0</span>
            <input type="range" min="0" max="100" value="50">
            <span>100</span>
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados profissionais</legend>
            <p>Natureza do cargo</p>
                <input type="radio" id="gerencia" name="natureza_cargo" value="Gerencia">
                <label for="gerencia">Gerencia</label>
                <input type="radio" id="financeiro" name="natureza_cargo" value="Financeiro">
                <label for="financeiro">Financeiro</label>
                <input type="radio" id="recepção" name="natureza_cargo" value="Recepção">
                <label for="recepção">Recepção</label>
                <input type="radio" id="administrativo" name="natureza_cargo" value="Administração">
                <label for="administrativo">Administrativo</label>
             <p>Área de interesse</p>
                <input type="checkbox" id="1" name="1" value="Computação">
                <label for="1">Computação</label>
                <input type="checkbox" id="2" name="2" value="Quimica">
                <label for="2"> Quimica</label>
                <input type="checkbox" id="3" name="3" value="Meio ambiente">
                <label for="3"> Meio ambiente</label>
                <input type="checkbox" id="4" name="4" value="Engenharia">
                <label for="5"> Engenharia</label>
                <input type="checkbox" id="5" name="5" value="Matemática">
                <label for="3">Matemática</label>
                <br><br>
                <label for="mini curriculo">Mini-Currículo:</label>
                <textarea id="Mini-Currículoe:" name="Mini-Currículo:" rows="4" cols="50"></textarea>

        </fieldset>
        
    </form>
    <input button type="submit" value="Enviar" >
    <a href="paginas.html"> Ir para a tabela</a>
</body>
</html>
